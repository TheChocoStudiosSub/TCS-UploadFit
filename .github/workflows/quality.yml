name: Quality checks

on:
  push:
    branches: [main, store-release-prep]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/processor.js
          node --check src/file-validation.js
          node --check src/presets.js
          node --check src/processor.worker.js
          node --check src/zip.js
          node --check src/i18n.js
          node --check sw.js

  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install the browser test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the same edition served by Vercel
        run: npm run build:demo
      - name: Start static servers for the production build and source smoke page
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist/demo > /tmp/uploadfit-app-http.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory . > /tmp/uploadfit-source-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null && curl --fail --silent http://127.0.0.1:4174/tests/smoke.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/uploadfit-app-http.log
          cat /tmp/uploadfit-source-http.log
          exit 1
      - name: Run browser smoke, production-build and offline checks
        env:
          UPLOADFIT_BASE_URL: http://127.0.0.1:4173
          UPLOADFIT_SMOKE_URL: http://127.0.0.1:4174/tests/smoke.html
        run: node tests/browser.e2e.mjs


  windows-host:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the Store web edition
        run: npm run build:store
      - name: Compile the Windows WebView2 host
        run: dotnet build packaging/WindowsApp/TCS.UploadFit.Host.csproj -c Release


  msix-package:
    runs-on: windows-2025
    needs: [test, browser]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build unsigned Store MSIX and upload container
        shell: pwsh
        run: .\scripts\build-msix.ps1 -KeepWork
      - name: Publish Store package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TCS-UploadFit-MSIX
          path: |
            dist/msix/*.msix
            dist/msix/*.msixbundle
            dist/msix/*.msixupload
          if-no-files-found: error
          retention-days: 14
