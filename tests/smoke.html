<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UploadFit browser checks</title></head>
<body><pre id="results">Running browser image checks…</pre><script type="module">
import { processImage, normalizeSettings, formatBytes } from '../src/processor.js';
import { createZip } from '../src/zip.js';
const output = document.querySelector('#results');
const results = [];
const check = (name, condition, detail = '') => results.push(`${condition ? 'PASS' : 'FAIL'} ${name}${detail ? `: ${detail}` : ''}`);
try {
  check('settings normalize', normalizeSettings({width:'320',height:'240',format:'image/png',mode:'fit',preserveRatio:true,noUpscale:true}).width === 320);
  check('byte formatting', formatBytes(1024) === '1.0 KB');
  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 480;
  const context = canvas.getContext('2d');
  context.fillStyle = '#e34f31'; context.fillRect(0,0,640,480);
  context.fillStyle = '#d9e36b'; context.fillRect(100,100,220,160);
  const sourceBlob = await new Promise(resolve => canvas.toBlob(resolve,'image/png'));
  const source = new File([sourceBlob], 'uploadfit-test.png', {type:'image/png'});
  const png = await processImage(source,{width:'320',height:'240',format:'image/png',mode:'fit',preserveRatio:true,noUpscale:true,quality:86,background:'#f4f0e7'});
  check('local PNG resize', png.width === 320 && png.height === 240 && png.mime === 'image/png', `${png.width} × ${png.height}`);
  const jpeg = await processImage(source,{width:'',height:'',maxSize:'500',sizeUnit:'KB',format:'image/jpeg',mode:'fit',preserveRatio:true,noUpscale:true,quality:82,background:'#ffffff'});
  check('PNG to JPEG conversion', jpeg.mime === 'image/jpeg' && jpeg.outputName.endsWith('.jpg'));
  const archive = await createZip([{name:png.outputName,blob:png.blob},{name:jpeg.outputName,blob:jpeg.blob}]);
  const signature = new Uint8Array(await archive.slice(0,4).arrayBuffer());
  check('ZIP local-header signature', signature.join(',') === '80,75,3,4');
} catch (error) {
  results.push(`FAIL browser pipeline: ${error.message}`);
}
const passed = results.filter(line => line.startsWith('PASS')).length;
output.textContent = `${results.join('\n')}\n\n${passed}/${results.length} browser checks passed`;
</script></body></html>
